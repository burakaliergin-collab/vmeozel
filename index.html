<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelime Avi</title>
  
  <!-- Apple ve Android PWA (Ana Ekran) Etiketleri -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
      text-align: center;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .hidden { display: none !important; }
    
    .panel {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    .settings-panel {
      background: #eef2f5;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      margin-bottom: 20px;
      border: 1px solid #ccc;
    }
    
    h1 { color: #2c3e50; }
    
    label { font-weight: bold; display: block; margin-top: 10px; margin-bottom: 5px; }
    select, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }
    
    .btn {
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-secondary { background-color: #95a5a6; color: white; }
    .btn-correct { background-color: #2ecc71; color: white; }
    .btn-wrong { background-color: #e74c3c; color: white; }
    
    .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap; /* Butonların küçük ekranda alt alta geçmesini sağlar */
    }
    .action-buttons .btn { flex: 1; min-width: 120px; }
    
    .word { font-size: 2.5em; font-weight: bold; color: #2c3e50; margin: 20px 0; word-wrap: break-word; }
    .translation { font-size: 1.8em; color: #7f8c8d; margin-bottom: 20px; font-weight: bold; }
    .timer { font-size: 3em; color: #e74c3c; font-weight: bold; margin: 10px 0; }
    .mic-status { font-size: 1.2em; color: #7f8c8d; margin: 15px 0; }
    .mic-active { color: #2ecc71; font-weight: bold; }
    .turn-indicator { font-size: 1.5em; color: #3498db; font-weight: bold; }
    
    .scoreboard { text-align: left; margin-top: 30px; }
    .player-score {
      background: #ecf0f1;
      padding: 10px;
      margin-bottom: 5px;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .settings-icon {
      font-size: 24px;
      cursor: pointer;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

<div id="setupScreen" class="panel">
  <div class="header-bar">
    <h1>Kelime Avı</h1>
    <button class="settings-icon" onclick="toggleSettings()">⚙️</button>
  </div>
  
  <div id="settingsPanel" class="settings-panel hidden">
    <label>Özel Kelime Listesi (JSON):</label>
    <input type="file" id="jsonUpload" accept=".json">
    
    <label>Kart Süresi:</label>
    <select id="timerSelect">
      <option value="10">10 Saniye</option>
      <option value="15">15 Saniye</option>
      <option value="30">30 Saniye</option>
    </select>
  </div>

  <label>Kaç Kişi Oynayacak?</label>
  <select id="playerCount" onchange="generatePlayerInputs()">
    <option value="2">2 Oyuncu</option>
    <option value="3">3 Oyuncu</option>
    <option value="4">4 Oyuncu</option>
    <option value="5">5 Oyuncu</option>
    <option value="6">6 Oyuncu</option>
    <option value="7">7 Oyuncu</option>
    <option value="8">8 Oyuncu</option>
  </select>

  <div id="playerInputs"></div>
  
  <button class="btn btn-primary" onclick="startGame()">Oyuna Başla</button>
</div>

<div id="gameScreen" class="panel hidden">
  <div class="turn-indicator" id="currentPlayerTurn"></div>
  <div class="timer" id="timeDisplay">10</div>
  
  <div class="word" id="germanWord">...</div>
  <div class="translation hidden" id="turkishWord">...</div>
  
  <div class="mic-status" id="micStatus">🎤 Mikrofon bekleniyor...</div>
  
  <div class="action-buttons hidden" id="actionBtns">
    <button class="btn btn-correct" onclick="handleAnswer(true)">✅ Doğru</button>
    <button class="btn btn-wrong" onclick="handleAnswer(false)">❌ Yanlış</button>
  </div>
  
  <button class="btn btn-secondary hidden" id="nextBtn" onclick="nextTurn()">Sonraki Kelime ➔</button>

  <div class="scoreboard" id="scoreBoard"></div>
</div>

<script>
  let words = [
    { german: "Der Apfel", turkish: "Elma" },
    { german: "Der Fußball", turkish: "Futbol Topu" },
    { german: "Das Fahrrad", turkish: "Bisiklet" },
    { german: "Die Katze", turkish: "Kedi" },
    { german: "Das Eis", turkish: "Dondurma" },
    { german: "Die Schere", turkish: "Makas" },
    { german: "Die Gitarre", turkish: "Gitar" },
    { german: "Das Buch", turkish: "Kitap" },
    { german: "Das Auto", turkish: "Araba" },
    { german: "Der Schlüssel", turkish: "Anahtar" }
  ];

  let players = [];
  let currentPlayerIndex = 0;
  let currentWord = null;
  let timerInterval;
  let audioContext;
  let analyser;
  let microphone;
  let isListening = false;
  let timeLimit = 10;
  let timeLeft = 10;
  
  document.getElementById('jsonUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].german) {
            words = parsed;
            alert(words.length + " kelime başarıyla yüklendi!");
          }
        } catch (err) {
          alert("JSON formatı hatalı!");
        }
      };
      reader.readAsText(file);
    }
  });

  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('hidden');
  }

  function generatePlayerInputs() {
    const count = document.getElementById('playerCount').value;
    const container = document.getElementById('playerInputs');
    container.innerHTML = '';
    for(let i = 1; i <= count; i++) {
      container.innerHTML += `<input type="text" id="p${i}" placeholder="${i}. Oyuncu Adı" value="Oyuncu ${i}">`;
    }
  }

  function speakGerman(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.rate = 0.85; 
      window.speechSynthesis.speak(utterance);
    }
  }

  async function startGame() {
    timeLimit = parseInt(document.getElementById('timerSelect').value);
    const count = document.getElementById('playerCount').value;
    players = [];
    for(let i = 1; i <= count; i++) {
      players.push({
        name: document.getElementById(`p${i}`).value || `Oyuncu ${i}`,
        score: 0
      });
    }
    
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    
    updateScoreBoard();
    
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      microphone = audioContext.createMediaStreamSource(stream);
      microphone.connect(analyser);
      analyser.fftSize = 256;
      startTurn();
    } catch (err) {
      alert("Mikrofon izni alınamadı! Oyun zilsiz olarak (sadece süreyle) devam edecek.");
      startTurn();
    }
  }

  function startTurn() {
    if (words.length === 0) {
      alert("Oyun Bitti! Kelimeler tükendi.");
      return;
    }
    
    document.getElementById('actionBtns').classList.add('hidden');
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('turkishWord').classList.add('hidden');
    
    const activePlayer = players[currentPlayerIndex];
    document.getElementById('currentPlayerTurn').innerText = `Sıra: ${activePlayer.name}`;
    
    const wordIndex = Math.floor(Math.random() * words.length);
    currentWord = words[wordIndex];
    words.splice(wordIndex, 1);
    
    document.getElementById('germanWord').innerText = currentWord.german;
    document.getElementById('turkishWord').innerText = currentWord.turkish;
    
    speakGerman(currentWord.german);
    
    timeLeft = timeLimit;
    document.getElementById('timeDisplay').innerText = timeLeft;
    
    isListening = true;
    checkAudio();
    
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timeDisplay').innerText = timeLeft;
      
      if (timeLeft <= 0) {
        timeOut();
      }
    }, 1000);
  }

  function checkAudio() {
    if (!isListening || !analyser) return;
    
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);
    
    let sum = 0;
    for(let i = 0; i < bufferLength; i++) {
      sum += dataArray[i];
    }
    let average = sum / bufferLength;
    
    document.getElementById('micStatus').innerText = "🎤 Dinleniyor...";
    document.getElementById('micStatus').className = "mic-status mic-active";

    if (average > 100) { 
      buzzerPressed();
    } else {
      requestAnimationFrame(checkAudio);
    }
  }

  function buzzerPressed() {
    isListening = false;
    clearInterval(timerInterval);
    document.getElementById('micStatus').innerText = "🔔 ZİL ÇALDI!";
    document.getElementById('micStatus').className = "mic-status";
    
    document.getElementById('turkishWord').classList.remove('hidden');
    document.getElementById('actionBtns').classList.remove('hidden');
  }

  function timeOut() {
    isListening = false;
    clearInterval(timerInterval);
    document.getElementById('micStatus').innerText = "⏰ Süre Doldu!";
    document.getElementById('micStatus').className = "mic-status";
    
    document.getElementById('turkishWord').classList.remove('hidden');
    words.splice(Math.min(15, words.length), 0, currentWord);
    document.getElementById('nextBtn').classList.remove('hidden');
  }

  function handleAnswer(isCorrect) {
    if (isCorrect) {
      players[currentPlayerIndex].score += 1;
    } else {
      players[currentPlayerIndex].score -= 1;
      words.splice(Math.min(15, words.length), 0, currentWord);
    }
    
    updateScoreBoard();
    document.getElementById('actionBtns').classList.add('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
  }

  function nextTurn() {
    currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
    startTurn();
  }

  function updateScoreBoard() {
    const board = document.getElementById('scoreBoard');
    board.innerHTML = '<h3>Skor Tablosu</h3>';
    players.forEach(p => {
      board.innerHTML += `<div class="player-score"><span>${p.name}</span> <span style="color:#2ecc71;">${p.score}</span></div>`;
    });
  }

  window.onload = generatePlayerInputs;
</script>

</body>
</html>
