<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelime Avi</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --dark: #292F36;
      --light: #F7FFF7;
      --glass: rgba(255, 255, 255, 0.85);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    #app {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      box-sizing: border-box;
      text-align: center;
      position: relative;
    }
    h1 {
      color: var(--primary);
      font-size: 2.5em;
      margin-top: 0;
      text-shadow: 2px 2px 0px #fff;
    }
    .settings-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 2em;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .settings-btn:hover {
      transform: rotate(90deg);
    }
    #settingsModal {
      display: none;
      position: absolute;
      top: 70px;
      right: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 100;
      text-align: left;
      border: 2px solid var(--secondary);
    }
    .setting-group {
      margin-bottom: 15px;
    }
    .setting-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--dark);
    }
    select, input[type="file"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #ddd;
      font-size: 1.1em;
      font-family: inherit;
    }
    button.btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.5em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      font-weight: bold;
      margin-top: 20px;
      width: 100%;
      transition: transform 0.2s;
    }
    button.btn:active {
      transform: scale(0.95);
    }
    .btn-secondary {
      background: var(--secondary);
      box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
    }
    .player-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      width: 100%;
      margin-top: 20px;
    }
    .player-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      font-weight: bold;
      font-size: 1.2em;
      border: 3px solid var(--secondary);
    }
    #gameScreen, #resultScreen {
      display: none;
      width: 100%;
    }
    .word-display {
      font-size: 3.5em;
      font-weight: bold;
      color: var(--dark);
      margin: 20px 0;
      word-wrap: break-word;
    }
    .timer {
      font-size: 2.5em;
      color: var(--primary);
      font-weight: bold;
      margin: 10px 0;
    }
    .mic-status {
      font-size: 1.2em;
      color: gray;
      margin-top: 10px;
    }
    .mic-active { color: #4CAF50; font-weight: bold; }
    .action-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .action-buttons button {
      flex: 1;
      padding: 20px;
      font-size: 1.5em;
    }
    .btn-correct { background: #4CAF50; }
    .btn-wrong { background: #F44336; }
    .translation-display {
      font-size: 2em;
      color: #555;
      margin-top: 10px;
      display: none;
      font-weight: bold;
    }
    .current-player-highlight {
      font-size: 1.5em;
      color: var(--primary);
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- KURULUM EKRANI -->
  <div id="setupScreen" class="glass-panel">
    <h1>🔍 Kelime Avı</h1>
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    
    <div id="settingsModal">
      <div class="setting-group">
        <label>Özel Kelime Listesi (JSON):</label>
        <input type="file" id="jsonUpload" accept=".json">
      </div>
      <div class="setting-group">
        <label>Kart Süresi:</label>
        <select id="timerSelect">
          <option value="10">10 Saniye</option>
          <option value="15">15 Saniye</option>
          <option value="30">30 Saniye</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="toggleSettings()" style="font-size:1em; padding:10px;">Kapat</button>
    </div>

    <div class="setting-group" style="text-align:left; margin-top:20px;">
      <label>Kaç Kişi Oynayacak?</label>
      <select id="playerCount" onchange="generatePlayerInputs()">
        <option value="2">2 Oyuncu</option>
        <option value="3">3 Oyuncu</option>
        <option value="4">4 Oyuncu</option>
        <option value="5">5 Oyuncu</option>
        <option value="6">6 Oyuncu</option>
        <option value="7">7 Oyuncu</option>
        <option value="8">8 Oyuncu</option>
      </select>
    </div>

    <div id="playerInputs" class="setting-group"></div>
    <button class="btn" onclick="startGame()">Oyuna Başla!</button>
  </div>

  <!-- OYUN EKRANI -->
  <div id="gameScreen" class="glass-panel">
    <div class="timer" id="timeDisplay">10</div>
    <div class="current-player-highlight" id="currentPlayerTurn"></div>
    
    <div class="word-display" id="germanWord">...</div>
    <div class="translation-display" id="turkishWord">...</div>
    
    <div class="mic-status" id="micStatus">🎤 Mikrofon bekleniyor...</div>
    
    <div class="action-buttons" id="actionBtns" style="display:none;">
      <button class="btn btn-correct" onclick="handleAnswer(true)">✅ Doğru (+1)</button>
      <button class="btn btn-wrong" onclick="handleAnswer(false)">❌ Yanlış (-1)</button>
    </div>
    
    <button class="btn btn-secondary" id="nextBtn" style="display:none;" onclick="nextTurn()">Sonraki Kelime ➔</button>

    <div class="player-list" id="scoreBoard"></div>
  </div>
</div>

<script>
  // Varsayılan Kelimeler
  let words = [
    { german: "Der Apfel", turkish: "Elma" },
    { german: "Der Fußball", turkish: "Futbol Topu" },
    { german: "Das Fahrrad", turkish: "Bisiklet" },
    { german: "Die Katze", turkish: "Kedi" },
    { german: "Das Eis", turkish: "Dondurma" },
    { german: "Die Schere", turkish: "Makas" },
    { german: "Die Gitarre", turkish: "Gitar" },
    { german: "Das Buch", turkish: "Kitap" },
    { german: "Das Auto", turkish: "Araba" },
    { german: "Der Schlüssel", turkish: "Anahtar" }
  ];

  let players = [];
  let currentPlayerIndex = 0;
  let currentWord = null;
  let timerInterval;
  let audioContext;
  let analyser;
  let microphone;
  let isListening = false;
  let timeLimit = 10;
  let timeLeft = 10;
  
  // JSON Yükleme Dinleyicisi
  document.getElementById('jsonUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].german) {
            words = parsed;
            alert(words.length + " kelime başarıyla yüklendi!");
          }
        } catch (err) {
          alert("JSON formatı hatalı!");
        }
      };
      reader.readAsText(file);
    }
  });

  function toggleSettings() {
    const modal = document.getElementById('settingsModal');
    modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
  }

  function generatePlayerInputs() {
    const count = document.getElementById('playerCount').value;
    const container = document.getElementById('playerInputs');
    container.innerHTML = '';
    for(let i = 1; i <= count; i++) {
      container.innerHTML += `<input type="text" id="p${i}" placeholder="Oyuncu ${i} Adı" value="Oyuncu ${i}" style="margin-bottom:10px;">`;
    }
  }

  // Sesli Okuma (Text-to-Speech) Fonksiyonu
  function speakGerman(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // Önceki sesleri durdur
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE'; // Almanca
      utterance.rate = 0.85; // Net ve anlaşılır standart okuma hızı
      window.speechSynthesis.speak(utterance);
    }
  }

  async function startGame() {
    // Ayarlardan süreyi al
    timeLimit = parseInt(document.getElementById('timerSelect').value);
    
    // Oyuncuları kaydet
    const count = document.getElementById('playerCount').value;
    players = [];
    for(let i = 1; i <= count; i++) {
      players.push({
        name: document.getElementById(`p${i}`).value || `Oyuncu ${i}`,
        score: 0
      });
    }
    
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    
    updateScoreBoard();
    
    // Mikrofon izni al
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      microphone = audioContext.createMediaStreamSource(stream);
      microphone.connect(analyser);
      analyser.fftSize = 256;
      startTurn();
    } catch (err) {
      alert("Mikrofon izni alınamadı! Oyun zilsiz olarak (sadece süreyle) devam edecek.");
      startTurn();
    }
  }

  function startTurn() {
    if (words.length === 0) {
      alert("Oyun Bitti! Kelimeler tükendi.");
      return;
    }
    
    document.getElementById('actionBtns').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('turkishWord').style.display = 'none';
    
    const activePlayer = players[currentPlayerIndex];
    document.getElementById('currentPlayerTurn').innerText = `Sıra: ${activePlayer.name}`;
    
    // Rastgele kelime seç
    const wordIndex = Math.floor(Math.random() * words.length);
    currentWord = words[wordIndex];
    words.splice(wordIndex, 1); // Havuzdan çıkar
    
    document.getElementById('germanWord').innerText = currentWord.german;
    document.getElementById('turkishWord').innerText = currentWord.turkish;
    
    // Kelimeyi Almanca seslendir
    speakGerman(currentWord.german);
    
    timeLeft = timeLimit;
    document.getElementById('timeDisplay').innerText = timeLeft;
    
    isListening = true;
    checkAudio();
    
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timeDisplay').innerText = timeLeft;
      
      if (timeLeft <= 0) {
        timeOut();
      }
    }, 1000);
  }

  function checkAudio() {
    if (!isListening || !analyser) return;
    
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);
    
    let sum = 0;
    for(let i = 0; i < bufferLength; i++) {
      sum += dataArray[i];
    }
    let average = sum / bufferLength;
    
    document.getElementById('micStatus').innerText = "🎤 Dinleniyor...";
    document.getElementById('micStatus').className = "mic-status mic-active";

    // Ses eşiği (Zil sesi algılama)
    if (average > 100) { 
      buzzerPressed();
    } else {
      requestAnimationFrame(checkAudio);
    }
  }

  function buzzerPressed() {
    isListening = false;
    clearInterval(timerInterval);
    document.getElementById('micStatus').innerText = "🔔 ZİL ÇALDI!";
    document.getElementById('micStatus').className = "mic-status";
    
    document.getElementById('turkishWord').style.display = 'block';
    document.getElementById('actionBtns').style.display = 'flex';
  }

  function timeOut() {
    isListening = false;
    clearInterval(timerInterval);
    document.getElementById('micStatus').innerText = "⏰ Süre Doldu!";
    document.getElementById('micStatus').className = "mic-status";
    
    document.getElementById('turkishWord').style.display = 'block';
    
    // Kelime bulunamadı, 15 kart sonra tekrar sormak için havuza geri ekle
    words.splice(Math.min(15, words.length), 0, currentWord);
    
    document.getElementById('nextBtn').style.display = 'block';
  }

  function handleAnswer(isCorrect) {
    if (isCorrect) {
      players[currentPlayerIndex].score += 1;
    } else {
      players[currentPlayerIndex].score -= 1;
      // Yanlış cevaplandı, tekrar havuzuna (yaklaşık 15 sıra sonraya) ekle
      words.splice(Math.min(15, words.length), 0, currentWord);
    }
    
    updateScoreBoard();
    document.getElementById('actionBtns').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'block';
  }

  function nextTurn() {
    currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
    startTurn();
  }

  function updateScoreBoard() {
    const board = document.getElementById('scoreBoard');
    board.innerHTML = '';
    players.forEach(p => {
      board.innerHTML += `<div class="player-card">${p.name}: <span style="color:var(--primary)">${p.score}</span></div>`;
    });
  }

  // Sayfa yüklendiğinde varsayılan oyuncu inputlarını oluştur
  window.onload = generatePlayerInputs;
</script>

</body>
</html>
